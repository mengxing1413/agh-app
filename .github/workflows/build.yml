name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign with community keystore (same as Clawket)
        run: |
          BT=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          curl -fsSL https://raw.githubusercontent.com/mengxing1413/clawket/main/.github/clawket-community.jks.b64 -o /tmp/ck.b64
          base64 -d /tmp/ck.b64 > /tmp/ck.jks
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/ck.jks --ks-key-alias clawket \
            --ks-pass pass:clawket123 --key-pass pass:clawket123 \
            --out AGH-mobile.apk /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs AGH-mobile.apk

      - name: Fingerprint
        run: |
          BT=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -1)
          unzip -o AGH-mobile.apk META-INF/* -d /tmp/apkmeta >/dev/null 2>&1 || true
          echo "APK size: $(du -h AGH-mobile.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: AGH-mobile-apk
          path: AGH-mobile.apk
